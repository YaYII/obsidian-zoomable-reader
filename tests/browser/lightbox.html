<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>ImageLightbox · 验证台</title>
<link rel="stylesheet" href="../../styles.css" />
<style>
  html, body { margin: 0; font-family: system-ui, sans-serif; }
  .markdown-rendered { padding: 24px; max-width: 900px; }
  .markdown-rendered img { max-width: 320px; border: 1px solid #ccc; }
  .mermaid { width: 420px; }
  /* 模拟 Obsidian 的 app.css：svg 不会超过版心宽度（否则常驻按钮会跑到屏幕外） */
  #svg-variants svg { max-width: 100%; }
</style>
</head>
<body>
<div class="markdown-preview-view markdown-rendered" id="note">
  <p>验证台：点图片或图表即打开可缩放查看器。</p>
  <p><img id="photo" alt="测试图片" /></p>
  <div class="mermaid" id="diagram-host">
    <svg id="diagram" viewBox="0 0 640 240" width="640" height="240" role="graphics-document">
      <rect x="2" y="2" width="636" height="236" rx="8" fill="none" stroke="#7a95ad"></rect>
      <rect x="30" y="80" width="200" height="70" rx="8" fill="#eef3f8" stroke="#3a6ea5"></rect>
      <text x="70" y="122" font-size="18" fill="#2f4a63">图表节点</text>
      <path d="M230 115 L420 115" stroke="#7a95ad" stroke-width="2" fill="none"></path>
      <rect x="420" y="80" width="190" height="70" rx="8" fill="#eef3f8" stroke="#3a6ea5"></rect>
      <text x="450" y="122" font-size="18" fill="#2f4a63">另一个节点</text>
    </svg>
  </div>
</div>

  <!-- 其它插件常见的三种 svg：只有 viewBox / width=100% / 固定像素。
       它们最容易「放不大」——尺寸由 CSS 或父容器决定，进查看器后自身尺寸成循环依赖。 -->
  <div class="markdown-rendered" id="svg-variants">
    <div class="block-language-chart" id="host-viewbox">
      <svg id="svg-viewbox" viewBox="0 0 1200 400" role="img">
        <rect x="10" y="10" width="1180" height="380" rx="10" fill="none" stroke="#7a95ad"></rect>
        <text x="40" y="200" font-size="42" fill="#2f4a63">只有 viewBox 的图</text>
      </svg>
    </div>
    <div id="host-percent">
      <svg id="svg-percent" viewBox="0 0 900 300" width="100%" height="200">
        <rect x="6" y="6" width="888" height="288" rx="10" fill="none" stroke="#7a95ad"></rect>
        <text x="30" y="160" font-size="36" fill="#2f4a63">width=100% 的图</text>
      </svg>
    </div>
    <div id="host-fixed">
      <svg id="svg-fixed" width="1600" height="300" viewBox="0 0 1600 300">
        <rect x="6" y="6" width="1588" height="288" rx="10" fill="none" stroke="#7a95ad"></rect>
        <text x="30" y="160" font-size="40" fill="#2f4a63">固定像素的宽图</text>
      </svg>
    </div>
  </div>

<script src="out/zoom-pan.js"></script>
<script>
  /* 图片用 canvas 现场生成（1600x900 的自然尺寸），避免依赖任何外部文件 */
  (function () {
    var canvas = document.createElement("canvas");
    canvas.width = 1600;
    canvas.height = 900;
    var ctx = canvas.getContext("2d");
    ctx.fillStyle = "#f7f5f0";
    ctx.fillRect(0, 0, 1600, 900);
    ctx.fillStyle = "#3a6ea5";
    ctx.fillRect(80, 80, 500, 200);
    ctx.fillStyle = "#2f4a63";
    ctx.font = "48px sans-serif";
    ctx.fillText("1600 x 900 测试图", 100, 200);
    document.getElementById("photo").src = canvas.toDataURL("image/png");
  })();

  var lightbox = new window.ImageLightbox(document, { fitOnOpen: true, maxScale: 64 });
  /* 与插件里同一条代码路径：悬停按钮 + 点击委派。
     forceHover=true 让无头浏览器也能走「桌面悬停」分支；
     setTouchMode() 换回真实触屏的判定（matchMedia('(hover: hover)') 为假 → 轻点即开）。 */
  /* corner：与插件设置里的「放大按钮的位置」同一参数。
     默认左上 —— 右上角是 Obsidian 自己的「编辑源文件 / 更多选项」入口，
     按钮贴在那里会把它盖住（用户实测反馈）。 */
  var currentCorner = "top-left";
  function installAffordance(mode) {
    if (window.lightboxHarnessDetach) window.lightboxHarnessDetach();
    window.lightboxHarnessDetach = window.installZoomAffordance(document, {
      images: true,
      diagrams: true,
      persistent: mode === "persistent",
      forceHover: mode === "hover",
      /* touch：既不常驻也不强制悬停 → 判定走 matchMedia，真实触屏即「轻点打开」 */
      clickToOpen: false,
      corner: currentCorner,
      label: "Zoom in",
      onTarget: function (found) {
        if (found.kind === "image") lightbox.openImage(found.element);
        else lightbox.openNode(found.element, { title: "Mermaid diagram" });
      }
    });
  }
  /* 默认走常驻模式（与插件默认一致） */
  installAffordance("persistent");
  window.lightboxHarness = {
    lightbox: lightbox,
    isOpen: function () { return lightbox.isOpen; },
    overlayCount: function () { return document.querySelectorAll(".zr-lightbox").length; },
    /** 当前查看器画布的变换（从 inline transform 里读回来，和用户在屏幕上看到的一致） */
    transform: function () {
      var canvas = document.querySelector(".zr-lightbox-canvas");
      if (!canvas) return null;
      var m = new DOMMatrixReadOnly(getComputedStyle(canvas).transform);
      return { scale: m.a, x: m.e, y: m.f };
    },
    label: function () {
      var el = document.querySelector(".zr-lightbox-label");
      return el ? el.textContent : null;
    },
    sizeText: function () {
      var el = document.querySelector(".zr-lightbox-size");
      return el ? el.textContent : null;
    },
    /** 图表是否已经被搬进查看器 / 关掉后是否回到原位 */
    diagramParentIsOverlay: function () {
      var svg = document.getElementById("diagram");
      return !!(svg && svg.closest(".zr-lightbox"));
    },
    diagramBackInPlace: function () {
      var svg = document.getElementById("diagram");
      var host = document.getElementById("diagram-host");
      if (!svg || !host) return false;
      if (svg.parentElement === host) return true;
      /* 常驻模式下图片会被包进 .zr-zoom-host；svg 不会被包装（见 lightbox.ts 说明） */
      var wrapper = svg.closest(".zr-zoom-host");
      return !!wrapper && wrapper.parentElement === host;
    },
    affordance: function () { return document.querySelector(".zr-zoom-affordance"); },
    affordanceBox: function () {
      var el = document.querySelector(".zr-zoom-affordance");
      if (!el || el.hidden) return null;
      var r = el.getBoundingClientRect();
      return { left: r.left, top: r.top, right: r.right, bottom: r.bottom, width: r.width, height: r.height };
    },
    affordanceVisible: function () {
      var el = document.querySelector(".zr-zoom-affordance");
      return !!(el && !el.hidden);
    },
    /* 查看器底色必须等于主题的 --background-primary（笔记底色）：
     * 图里有不透明元素（边标签底矩形），底色不一致时它们会变成一块块亮斑。 */
    backgroundMatchesNote: function () {
      var probe = document.createElement("div");
      probe.style.background = "var(--background-primary)";
      document.body.appendChild(probe);
      var want = getComputedStyle(probe).backgroundColor;
      probe.remove();
      var viewport = document.querySelector(".zr-lightbox-viewport");
      return !!viewport && getComputedStyle(viewport).backgroundColor === want;
    },
    canvasTransparent: function () {
      var canvas = document.querySelector(".zr-lightbox-canvas");
      if (!canvas) return false;
      var bg = getComputedStyle(canvas).backgroundColor;
      return bg === "rgba(0, 0, 0, 0)" || bg === "transparent";
    },
    contentStyle: function () {
      var el = document.querySelector(".zr-lightbox-image, .zr-lightbox-node svg");
      if (!el) return null;
      var cs = getComputedStyle(el);
      return {
        background: cs.backgroundColor,
        borderWidth: cs.borderTopWidth,
        boxShadow: cs.boxShadow,
        borderRadius: cs.borderTopLeftRadius,
      };
    },
    setPersistentMode: function () { installAffordance("persistent"); },
    setCorner: function (corner) { currentCorner = corner; installAffordance("persistent"); },
    corner: function () { return currentCorner; },
    /** 按钮当前的类名（is-left / is-right）：验证「角」真的是可配的 */
    affordanceClassFor: function (id) {
      var btn = window.lightboxHarness.affordanceFor(id);
      return btn ? btn.className : null;
    },
    /** 右上角 26x26 的「编辑入口区」是否被按钮盖住：这是用户报的那个问题 */
    coversTopRightCorner: function (id) {
      var photo = document.getElementById(id);
      var box = window.lightboxHarness.affordanceBoxFor(id);
      if (!photo || !box) return false;
      var r = photo.getBoundingClientRect();
      var zone = { left: r.right - 32, right: r.right, top: r.top, bottom: r.top + 32 };
      return box.left < zone.right && zone.left < box.right && box.top < zone.bottom && zone.top < box.bottom;
    },
    setHoverMode: function () { installAffordance("hover"); },
    setTouchMode: function () { installAffordance("touch"); },
    /** 常驻模式下：某个目标自己的按钮（在它的 .zr-zoom-host 包装里） */
    affordanceFor: function (id) {
      var target = document.getElementById(id);
      if (!target) return null;
      var host = target.closest(".zr-zoom-host");
      return host ? host.querySelector(".zr-zoom-affordance") : null;
    },
    affordanceBoxFor: function (id) {
      var btn = window.lightboxHarness.affordanceFor(id);
      if (!btn || btn.hidden) return null;
      var r = btn.getBoundingClientRect();
      return { left: r.left, top: r.top, right: r.right, bottom: r.bottom, width: r.width, height: r.height };
    },
    affordanceVisibleFor: function (id) {
      var btn = window.lightboxHarness.affordanceFor(id);
      if (!btn) return false;
      var cs = getComputedStyle(btn);
      return !btn.hidden && cs.display !== "none" && cs.visibility !== "hidden";
    },
    hostWrapped: function (id) {
      var target = document.getElementById(id);
      return !!(target && target.closest(".zr-zoom-host"));
    },
    hostCount: function () { return document.querySelectorAll(".zr-zoom-host").length; },
    setTouchMode2: function () { installAffordance("touch"); },
    openImage: function () { lightbox.openImage(document.getElementById("photo")); },
    openDiagram: function () { lightbox.openNode(document.getElementById("diagram"), { title: "Mermaid diagram" }); },
    clickToolbar: function (title) {
      var buttons = document.querySelectorAll(".zr-lightbox-btn");
      for (var i = 0; i < buttons.length; i++) {
        if (buttons[i].getAttribute("title") === title) { buttons[i].click(); return true; }
      }
      return false;
    },
    rect: function () {
      var el = document.querySelector(".zr-lightbox-viewport");
      if (!el) return null;
      var r = el.getBoundingClientRect();
      return { left: r.left, top: r.top, width: r.width, height: r.height };
    }
  };
</script>
</body>
</html>
