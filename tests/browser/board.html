<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Zoomable Reader · 白板（一整张 1280 版面）验证台</title>
<style>
  /* 与 styles.css 保持一致（验证台不依赖打包后的插件样式），颜色用固定值：
     验证的是【版面宽度与手势】，不是主题。 */
  html, body { margin: 0; height: 100%; font-family: system-ui, "Noto Sans CJK SC", sans-serif; }
  .zr-root { display: flex; flex-direction: column; height: 100%; }
  .zr-toolbar { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-bottom: 1px solid #ddd; background: #f4f4f4; font-size: 13px; }
  .zr-label { min-width: 60px; font-variant-numeric: tabular-nums; }
  .zr-viewport { position: relative; flex: 1 1 auto; overflow: hidden; background: #eceff1; cursor: grab; touch-action: none; overscroll-behavior: contain; }
  .zr-canvas { position: absolute; top: 0; left: 0; width: max-content; transform-origin: 0 0; }
  /* 一整张版面：没有卡片、没有分栏 —— 白板模式只是把它放宽到 1280 */
  .zr-page { margin: 0; background: #fff; border: 1px solid #ddd; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.12); padding: 24px; box-sizing: border-box; }
  .zr-page h1 { font-size: 26px; } .zr-page h2 { font-size: 21px; } .zr-page h3 { font-size: 17px; }
  .zr-page p { margin: 10px 0; line-height: 1.7; }
  .zr-page table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .zr-page td, .zr-page th { border: 1px solid #e2e2e6; padding: 4px 8px; }
  .zr-page img { display: block; max-width: 100%; height: auto; }
  .zr-viewport.zr-animating .zr-canvas { transition: transform 240ms cubic-bezier(0.22, 0.61, 0.36, 1); }
</style>
</head>
<body>
<div class="zr-root zr-mode-board" id="root">
  <div class="zr-toolbar"><span class="zr-label" id="label">100%</span><span id="commits">0</span><span id="note"></span></div>
  <div class="zr-viewport" id="viewport">
    <div class="zr-canvas" id="canvas">
      <div class="markdown-preview-view markdown-rendered zr-page" id="page"></div>
    </div>
  </div>
</div>
<script src="out/zoom-pan.js"></script>
<script>
/* ============================================================================
 * 验证台：用真实 DOM 渲染【一整张】版面，再用真实事件驱动它。
 * 这里刻意复制插件视图的装配顺序（建层 → 渲染 → 定宽度 → 定变换），
 * 因为要验证的正是这套装配在真浏览器里的结果：宽度、平移、缩放、往下滑。
 * ========================================================================== */

/* 一篇有代表性的中文笔记：长正文、宽表格、图片、多级标题。 */
var DOC = [
  "# 白板模式验证",
  "这一页用来验证「白板 = 一整张 1280px 宽的版面」：没有卡片、没有分栏，往下滑就是往下读。",
  "## 为什么要宽版面",
  "手机上阅读视图不能双指缩放，宽表格与长图只能干瞪眼；把版面放宽到网页版心宽（1280px），" +
    "一行放得下长句、表格有地方铺，配合捏合缩放就能读细节。",
  "### 段落一",
  "中文笔记常写到四五级标题。这一段刻意写长，用来验证「先建、再量、再定宽」这条顺序是否成立：" +
    "如果宽度在后、测量在前，页面高度就是错的，往下滑会滑不到底或者滑过头。",
  "### 段落二",
  "版面宽度是白板与版面模式唯一的区别：版面模式跟随主题行宽（多数主题 700~760px），" +
    "白板模式固定用它自己的宽度（默认 1280px）。两者共用同一套手势层与同一份位置记忆。",
  "## 一张宽表",
  "| 手势 | 手机 | 桌面 |",
  "| --- | --- | --- |",
  "| 平移 | 单指拖动 | 拖动 / 滚轮 |",
  "| 缩放 | 双指捏合 | Ctrl + 滚轮 |",
  "| 复位 | 双击 | 双击 |",
  "## 一张图",
  "下面这张图用来验证宽版面里媒体不溢出。",
  "![验证用图片](data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%221200%22%20height%3D%22300%22%3E%3Crect%20width%3D%221200%22%20height%3D%22300%22%20fill%3D%22%23dfe6ee%22%2F%3E%3Ctext%20x%3D%2230%22%20y%3D%22160%22%20font-size%3D%2236%22%20fill%3D%22%23556%22%3E1200x300%20%E9%AA%8C%E8%AF%81%E5%9B%BE%3C%2Ftext%3E%3C%2Fsvg%3E)",
  "## 长尾",
  "最后一段：验证「一直往下滑能读到文档末尾」。滑到这一句，说明版面高度算对了、平移也没有被夹住。",
].join("\n\n");

var rootEl = document.getElementById("root");
var viewport = document.getElementById("viewport");
var canvas = document.getElementById("canvas");
var page = document.getElementById("page");
var label = document.getElementById("label");

var settings = {
  /* 宽度直接取出厂默认（1280），验证器就不必把数字抄一遍 */
  boardWidth: window.ZoomableReaderDefaults.boardWidth,
  themeLineWidth: 760,
  padding: 16,
  pinch: true,
  doubleTapZoom: 2,
  mode: "board",
};

var layer = null;
var commits = 0;

/* 极简 Markdown → DOM：验证台只关心版面尺寸与手势，不需要 Obsidian 的渲染器 */
function renderMarkdown(text) {
  var html = "";
  text.split(/\n\n/).forEach(function (block) {
    if (/^### /.test(block)) html += "<h3>" + block.slice(4) + "</h3>";
    else if (/^## /.test(block)) html += "<h2>" + block.slice(3) + "</h2>";
    else if (/^# /.test(block)) html += "<h1>" + block.slice(2) + "</h1>";
    else if (/^\|/.test(block)) {
      var rows = block.split("\n").filter(function (r) { return !/^\|?[\s:|-]+\|?$/.test(r) || r.indexOf("-") < 0; });
      html += "<table>" + rows.map(function (r, i) {
        var cells = r.replace(/^\||\|$/g, "").split("|").map(function (c) {
          return "<" + (i === 0 ? "th" : "td") + ">" + c.trim() + "</" + (i === 0 ? "th" : "td") + ">";
        }).join("");
        return "<tr>" + cells + "</tr>";
      }).join("") + "</table>";
    } else if (/^!\[/.test(block)) {
      var m = /^!\[([^\]]*)\]\(([^)]+)\)/.exec(block);
      if (m) html += '<img alt="' + m[1] + '" src="' + m[2].replace(/%3D/g, "=").replace(/%2F/g, "/") + '">';
    } else html += "<p>" + block + "</p>";
  });
  return html;
}

function applyWidth() {
  var available = Math.max(240, viewport.clientWidth - settings.padding * 2);
  var width = settings.mode === "board"
    ? Math.max(240, settings.boardWidth)
    : Math.min(settings.themeLineWidth, available);
  page.style.width = width + "px";
  return width;
}

function buildLayer() {
  if (layer) layer.destroy();
  layer = new window.ZoomPanLayer(viewport, canvas, {
    minScale: settings.mode === "board" ? window.ZoomPanFormat.boardMinScale : undefined,
    maxScale: 64,
    doubleTapZoom: settings.doubleTapZoom,
    pinch: settings.pinch,
    onCommit: function (t) {
      commits += 1;
      document.getElementById("commits").textContent = String(commits);
      label.textContent = window.ZoomPanFormat.percent(t.scale);
    },
  });
}

function render(mode) {
  if (mode) settings.mode = mode;
  rootEl.className = "zr-root " + (settings.mode === "board" ? "zr-mode-board" : "zr-mode-page");
  page.innerHTML = renderMarkdown(DOC);
  applyWidth();
  buildLayer();
  layer.reset(settings.padding);
  document.getElementById("note").textContent =
    settings.mode + " · page " + Math.round(page.getBoundingClientRect().width) +
    "x" + Math.round(page.getBoundingClientRect().height);
}

render("board");

var vrect = function () { var r = viewport.getBoundingClientRect(); return { left: r.left, top: r.top, width: r.width, height: r.height }; };

window.harness = {
  get commits() { return commits; },
  state: function () { return layer.transform; },
  rect: vrect,
  mode: function () { return settings.mode; },
  setMode: function (mode) { render(mode); },
  setBoardWidth: function (w) { settings.boardWidth = w; render(); },
  boardWidth: function () { return settings.boardWidth; },
  /** 版面在【视口坐标系】里的矩形（含缩放），验证宽度/高度就用它 */
  pageBox: function () {
    var v = vrect();
    var r = page.getBoundingClientRect();
    return { left: r.left - v.left, top: r.top - v.top, width: r.width, height: r.height };
  },
  pageCount: function () { return document.querySelectorAll(".zr-page").length; },
  /** 卡片概念是否残留：这些选择器必须一个都查不到 */
  cardArtifacts: function () {
    return document.querySelectorAll(".zr-card, [data-zr-card], .zr-board, .zr-board-links, .zr-board-host").length;
  },
  contentPoint: function (px, py) { var t = layer.transform; return { x: (px - t.x) / t.scale, y: (py - t.y) / t.scale }; },
  fitWidth: function () { layer.fitWidth(settings.padding); },
  reset: function (p) { layer.reset(p === undefined ? settings.padding : p); },
  setPinch: function (on) { settings.pinch = !!on; var t = layer.transform; buildLayer(); layer.setTransform(t, false); },
  snapshot: function () {
    return {
      mode: settings.mode,
      scale: layer.transform.scale,
      pageWidth: page.getBoundingClientRect().width,
      pageHeight: page.getBoundingClientRect().height,
      commits: commits,
    };
  },
};
</script>
</body>
</html>
